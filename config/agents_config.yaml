active_agents:
  - name: pro
    type: ProAgent
    model: gemini-3.1-flash-lite
    enabled: true
    temperature: 0.3
    max_tokens: 500
    description: "Optimistic analyst - finds positive evidence and bullish arguments"

  - name: con
    type: ConAgent
    model: gemini-3.1-flash-lite
    enabled: true
    temperature: 0.4
    max_tokens: 500
    description: "Skeptical analyst - identifies risks and bearish factors"

  - name: judge
    type: JudgeAgent
    model: gemini-3.5-flash
    enabled: true
    temperature: 0.2
    max_tokens: 800
    description: "Balanced synthesizer - creates final verdict and trust score"

  - name: fact_checker
    type: FactCheckerAgent
    model: gemini-3.1-flash-lite
    enabled: true
    temperature: 0.1
    max_tokens: 400
    description: "Validates claims against source documents"

  - name: reporter
    type: ReporterAgent
    model: gemini-3.1-flash-lite
    enabled: true
    temperature: 0.3
    max_tokens: 1000
    description: "Formats final output into structured report"

debate_settings:
  max_rounds: 5
  timeout_per_agent: 60
  require_citations: true
  min_sources: 2
